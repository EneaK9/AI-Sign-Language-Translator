[project]
name = "signapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EneaK9", email = "eneakuca0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "fastapi>=0.163.1",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.50",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
signapp = "signapp.main:run"
signapp-pipeline = "signapp.pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
